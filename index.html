<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#13221A">
<title>Temporada de Growth</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Prancheta tática: placar escuro de estádio, gramado como peça central, dourado como destaque único */
  --board:#E4E8E2; --panel:#F6F8F4; --ink:#14231B; --muted:#55655B; --line:#C9D1C8;
  --grass:#2F8052; --grass-dk:#2A7549; --chalk:#F4F7F0;
  --placard:#13221A; --placard-2:#24362c; --gold:#F5B82E; --gold-soft:#FFF4D6; --red:#C8402F;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--board);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.05;text-wrap:balance}
h2{font-size:30px} h3{font-size:20px}
p{margin:0}
a{color:var(--grass)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Topo */
.top{position:sticky;top:0;z-index:20;background:var(--placard);color:var(--chalk);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-size:24px;color:var(--chalk)}
.brand h1 span{color:var(--gold)}
.mini{display:flex;gap:14px;align-items:baseline;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini b{font-family:var(--display);font-size:24px;color:var(--gold)}
.mini small{color:#9FB3A6;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:#B9C8BD;padding:8px 10px 9px;font-weight:600;font-size:14px;cursor:pointer;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-current="page"]{color:var(--chalk);border-bottom-color:var(--gold)}
nav.tabs .pip{font-size:11px;background:var(--placard-2);border-radius:10px;padding:1px 7px;color:#B9C8BD;font-variant-numeric:tabular-nums}

main{max-width:1180px;margin:0 auto;padding:18px 16px 64px;display:flex;flex-direction:column;gap:16px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sec-head .lead{color:var(--muted);max-width:68ch;margin-top:6px}
.switch{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 10px 5px 6px;cursor:pointer;font-weight:600;font-size:13px}
.switch i{width:34px;height:20px;border-radius:10px;background:#C5CEC4;position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-checked="true"] i{background:var(--grass)}
.switch[aria-checked="true"] i::after{left:16px}

.guide{background:var(--gold-soft);border:1px solid #F0D58C;border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start}
.guide svg{grid-row:span 3;width:54px;height:54px}
.guide h3{font-size:17px}
.guide ol{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.guide .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.done{border-left:6px solid var(--grass)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],input[type=number],input[type=url],select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px}
textarea{min-height:76px;resize:vertical}
input::placeholder,textarea::placeholder{color:#8A988F}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px 0}
.check input{width:22px;height:22px;accent-color:var(--grass);flex:none;margin:0}
.check span{padding-top:1px}
.check em{display:block;font-style:normal;color:var(--muted);font-size:13px}
.pts{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:12px;letter-spacing:.04em;background:#E3EEDF;color:var(--grass);border-radius:12px;padding:2px 9px;white-space:nowrap}
.pts.off{background:#ECEFEA;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid var(--ink);background:var(--panel);font-weight:600;cursor:pointer}
.btn.primary{background:var(--grass);border-color:var(--grass);color:#fff}
.btn.ghost{border-color:var(--line)}
.btn.danger{border-color:var(--red);color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Placar */
.score{background:var(--placard);color:var(--chalk);border-radius:12px;display:grid;grid-template-columns:repeat(5,1fr);overflow:hidden}
.score>div{padding:14px 16px;border-left:1px solid #2b3d33;display:flex;flex-direction:column;gap:2px;min-width:0}
.score>div:first-child{border-left:0}
.score .l{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#9FB3A6}
.score .v{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.score .v small{font-size:16px;color:#9FB3A6;margin-left:4px}
.score .v.word{font-size:28px;line-height:40px;overflow-wrap:anywhere}
.score .s{font-size:12px;color:#B9C8BD}
.gold{color:var(--gold)}
.pitchwrap{background:var(--placard);border-radius:12px;padding:10px}
.pitchwrap svg{display:block;width:100%;height:auto;border-radius:6px}
.tok{cursor:pointer}
.tok:focus{outline:none}
.tok:focus-visible .halo,.tok.sel .halo{stroke:var(--gold);stroke-width:6;opacity:1}
.cap{color:#B9C8BD;font-size:13px;padding:8px 4px 2px}
.camp{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.sum .num{font-family:var(--display);font-weight:800;font-size:36px;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--chalk);display:grid;place-items:center;flex:none}
.sum .num.gk{background:var(--gold);color:var(--ink)}
.bar{height:8px;background:#DDE3DB;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grass)}
.jog{border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-top:0}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.cur td{background:#E3EEDF;font-weight:600}
.tablewrap{overflow-x:auto}

/* Rotina */
.weeks{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.wk{border:1px solid var(--line);background:#fff;border-radius:8px;min-height:40px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;font-size:13px;padding:0}
.wk.part{background:var(--gold-soft);border-color:#E9C567}
.wk.full{background:var(--grass);border-color:var(--grass);color:#fff}
.wk[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid var(--line)}

/* Regras */
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fig{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.fig svg{display:block;width:100%;height:auto}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.step b{font-family:var(--display);font-size:34px;line-height:1;color:var(--grass)}
.hero{background:var(--placard);color:var(--chalk);border-radius:14px;padding:22px;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
.hero h2{font-size:40px;color:var(--chalk)}
.hero h2 span{color:var(--gold)}
.hero p{color:#C9D6CD;max-width:56ch}

/* Modal de boas-vindas */
.ov{position:fixed;inset:0;background:rgba(10,20,14,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:16px;max-width:520px;width:100%;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .art{background:var(--grass);padding:18px;display:grid;place-items:center}
.modal .art svg{width:100%;max-width:300px;height:auto}
.modal .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:#C5CEC4}
.dots i.on{background:var(--grass);width:22px;border-radius:4px}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .25s ease}@keyframes pop{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}.ball{transition:transform .6s ease}}

@media (max-width:900px){
  .camp{grid-template-columns:1fr}
  .score{grid-template-columns:repeat(2,1fr)}
  .score>div{border-left:0;border-top:1px solid #2b3d33}
  .score>div:first-child{grid-column:span 2;border-top:0}
  .rules,.hero{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  h2{font-size:26px} .hero h2{font-size:32px}
  .brand h1{font-size:20px} .mini b{font-size:20px} .mini .hide-s{display:none}
  .grid2,.grid3,.steps3{grid-template-columns:1fr}
  .weeks{grid-template-columns:repeat(6,1fr)}
  .score .v{font-size:32px} .score .v.word{font-size:22px;line-height:32px}
  main{padding-top:14px}
  .guide{grid-template-columns:1fr}.guide svg{display:none}
  .hide-mobile{display:none}
}
.syncpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#B9C8BD;white-space:nowrap}
.syncpill i{width:8px;height:8px;border-radius:50%;background:#7d8c82}
.syncpill.ok i{background:#5BD38A}.syncpill.err i{background:var(--gold)}
.purpose{background:#fff;border:1px solid #F0D58C;border-radius:10px;padding:10px 12px;grid-column:1/-1}
.purpose b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.ex{grid-column:1/-1;background:#fff;border:1px dashed #D9B75A;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ex .tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:var(--ink);border-radius:10px;padding:2px 9px}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start;border-top:1px solid var(--line);padding-top:10px}
.exrow:first-of-type{border-top:0;padding-top:0}
.exval{background:#F8FAF6;border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.exwhy{font-size:13px;color:var(--muted);display:flex;gap:8px}
.exwhy::before{content:"✓";color:var(--grass);font-weight:700}
.extabs{display:flex;gap:6px;flex-wrap:wrap}
.extabs button{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:5px 12px;font-weight:600;font-size:13px;cursor:pointer}
.extabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
@media (max-width:640px){.exrow{grid-template-columns:1fr}}
@media print{.top,.guide,.switch{display:none}}
</style>
</head>

<script>

var REQ=RITOS.filter(function(r){return r[3]}).map(function(r){return r[0]});
var DIVS=[[0,'Base','Defesa','Começando a temporada: rotina e fundamentos'],[250,'Profissional','Meio-campo','Rotina firme e primeiras análises entregues'],[600,'Titular','Ataque','Entrega com autonomia e apresenta para fora da squad'],[1000,'Craque','Grande área','Temporada fechada com evidências em todas as frentes']];
/* id, camisa, jogada, pontos, máximo, seção onde registrar */
var MS=[

 ['anal',5,'Análise de fonte de tráfego apresentada',40,6,'analises'],

 ['post',7,'Post do mês publicado no LinkedIn',15,6,'agenda'],

function DEF(){return {v:2,perfil:{nome:'',gestor:'',inicio:''},
 pdi:{objetivo:'',vejoHard:'',vejoSoft:'',fortalezas:'',oportunidades:'',momento:'',passo1:'',passo2:'',passo3:''},

function merge(d,s){if(Array.isArray(d)){return d.map(function(x,i){return (s&&s[i]!==undefined)?merge(x,s[i]):x}).concat(Array.isArray(s)&&d.length===0?s:[])}

 return (s===undefined||s===null||typeof s!==typeof d)?d:s}

  var i=last; if(i>=0&&!W[i]) i--; var inv=0; for(;i>=0&&W[i];i--) inv++;
  c.road=S.roadmap.feito?1:0;
  CURSOS.forEach(function(k,j){c[k.id]=S.cursos[j].status==='Concluído'?1:0});
  c.anal=S.analises.filter(function(a){return a.feita}).length;

  c.post=S.agenda.filter(function(a){return a.postFeito}).length;
  c.apres=S.agenda.filter(function(a){return a.apFeita}).length;

  if(t.id==='imp'&&t.files&&t.files[0]){var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o||o.v!==2)throw 0;S=merge(DEF(),o);S.sec='inicio';save(true);render();msg('Backup importado.')}catch(x){msg('Este arquivo não é um backup da Temporada de Growth.')}};rd.readAsText(t.files[0]);return}
  var p=t.getAttribute&&t.getAttribute('data-p'); if(!p) return;
  set(p,t.type==='checkbox'?t.checked:t.value); save(true);
  if(t.type==='checkbox'||t.tagName==='SELECT') render(); else refreshLight()});
